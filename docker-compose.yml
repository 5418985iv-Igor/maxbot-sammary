services:
  maxbot-sammary:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_PATH=${BASE_PATH:-/max}
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/max}
    container_name: maxbot-sammary
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BASE_PATH=${BASE_PATH:-/max}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/max}
      - MAX_WEBHOOK_URL=${MAX_WEBHOOK_URL:-https://vivonline.ru/max/webhook/max}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
